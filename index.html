<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Guess the Epal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Michroma&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --void:#0A0611; --panel:#150E26; --panel2:#1D1435; --line:#2E2050;
  --iris:#7B4DFF; --iris-deep:#5A2FD8; --lilac:#B9A8F5;
  --strike:#FF2E6B; --text:#EDE7FF; --dim:#8B79BC; --live:#37E39B; --warn:#FFB020;
  --r:14px;
  --display:'Michroma',ui-sans-serif,system-ui,sans-serif;
  --body:'Outfit',ui-sans-serif,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--void);color:var(--text);font-family:var(--body);-webkit-font-smoothing:antialiased;
  min-height:100dvh;display:flex;flex-direction:column;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(60rem 40rem at 12% -10%,rgba(123,77,255,.20),transparent 60%),
             radial-gradient(46rem 34rem at 98% 4%,rgba(255,46,107,.10),transparent 62%)}

/* host-set custom backdrop */
.bg{position:fixed;inset:0;z-index:1;pointer-events:none;background-size:cover;background-position:center;
  opacity:0;transition:opacity .5s ease}
body.hasbg .field img{opacity:.03}
body.hasbg::before{opacity:.55}

.field{position:fixed;inset:0;z-index:2;pointer-events:none;overflow:hidden}
.field img{position:absolute;opacity:.06;will-change:transform}
.field img:nth-child(1){width:210px;top:8%;left:5%;animation:drift 34s ease-in-out infinite}
.field img:nth-child(2){width:150px;top:62%;left:12%;animation:drift2 44s ease-in-out infinite}
.field img:nth-child(3){width:260px;top:30%;left:74%;animation:drift 52s ease-in-out infinite -8s}
.field img:nth-child(4){width:130px;top:84%;left:60%;animation:drift2 38s ease-in-out infinite -14s}
.field img:nth-child(5){width:180px;top:4%;left:52%;animation:drift2 48s ease-in-out infinite -22s}
.field img:nth-child(6){width:120px;top:47%;left:34%;animation:drift 41s ease-in-out infinite -5s;opacity:.04}
@keyframes drift{0%,100%{transform:translate3d(0,0,0) rotate(-5deg)}50%{transform:translate3d(34px,-46px,0) rotate(5deg)}}
@keyframes drift2{0%,100%{transform:translate3d(0,0,0) rotate(6deg)}50%{transform:translate3d(-40px,38px,0) rotate(-4deg)}}

.wrap{position:relative;z-index:3;width:min(1240px,100%);margin:0 auto;padding:18px 20px 40px;flex:1;display:flex;flex-direction:column}

header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-bottom:18px}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto}
.brand img{width:56px;height:56px;object-fit:contain;filter:drop-shadow(0 6px 16px rgba(123,77,255,.5))}
.brand .kicker{font-family:var(--display);font-size:9px;letter-spacing:.28em;color:var(--lilac);opacity:.75;display:block;margin-bottom:5px}
.brand h1{font-family:var(--display);font-size:clamp(14px,2.5vw,20px);letter-spacing:.1em;font-weight:400;line-height:1}
.hud{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

.tally{display:flex;align-items:baseline;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px 16px}
.tally b{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.tally span{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}

/* timer */
.clock{display:flex;align-items:center;gap:9px;background:var(--panel);border:1px solid var(--line);
  border-radius:999px;padding:7px 18px;transition:border-color .3s,background .3s}
.clock .t{font-family:var(--display);font-size:19px;font-variant-numeric:tabular-nums;letter-spacing:.04em;line-height:1.2}
.clock .lab{font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
.clock.low{border-color:var(--warn)}
.clock.low .t{color:var(--warn)}
.clock.crit{border-color:var(--strike);background:rgba(255,46,107,.12);animation:pulse .9s ease-in-out infinite}
.clock.crit .t{color:var(--strike)}
.clock.done{border-color:var(--strike);background:rgba(255,46,107,.2)}
.clock.done .t{color:var(--strike)}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}

button{font-family:var(--body);cursor:pointer;border:0;color:inherit;font-size:14px}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:9px 17px;font-weight:500;
  transition:background .16s,border-color .16s,transform .1s}
.btn:hover{background:var(--panel2);border-color:var(--iris)}
.btn:active{transform:translateY(1px)}
.btn.solid{background:linear-gradient(180deg,var(--iris),var(--iris-deep));border-color:transparent;font-weight:600}
.btn.solid:hover{filter:brightness(1.12)}
.btn.sm{padding:6px 13px;font-size:13px}
:focus-visible{outline:2px solid var(--lilac);outline-offset:3px}

.vol{display:flex;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 6px;gap:2px}
.spk{width:32px;height:32px;border-radius:50%;background:transparent;display:grid;place-items:center;flex:none}
.spk:hover{background:rgba(123,77,255,.18)}
.spk svg{width:17px;height:17px;fill:none;stroke:var(--text);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.vol.muted .spk svg{stroke:var(--dim)}
.slidewrap{width:0;overflow:hidden;transition:width .22s ease,margin .22s ease;display:flex;align-items:center}
.vol.open .slidewrap{width:98px;margin:0 8px 0 2px}
input[type=range]{-webkit-appearance:none;appearance:none;width:98px;height:4px;border-radius:4px;background:var(--line);outline:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--lilac);border:2px solid var(--iris-deep);cursor:pointer}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--lilac);border:2px solid var(--iris-deep);cursor:pointer}

/* board */
.board{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(126px,1fr))}
.card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  overflow:hidden;aspect-ratio:3/4;display:block;width:100%;padding:0;text-align:left;
  transition:border-color .16s,transform .14s}
.card:hover{border-color:var(--iris);transform:translateY(-2px)}
.card .pic{position:absolute;inset:0}
.card .pic img{width:100%;height:100%;object-fit:cover;display:block}
.card .initial{width:100%;height:100%;display:grid;place-items:center;font-family:var(--display);font-size:34px;color:rgba(255,255,255,.9)}
.card .plate{position:absolute;left:0;right:0;bottom:0;padding:22px 10px 9px;
  background:linear-gradient(to top,rgba(10,6,17,.96) 30%,transparent);
  font-weight:600;font-size:13.5px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .stamp{position:absolute;inset:0;opacity:0;pointer-events:none}
.card.out .pic{filter:grayscale(1) brightness(.34)}
.card.out .plate{color:var(--dim)}
.card.out{border-color:rgba(255,46,107,.4)}
.card.out .stamp{opacity:1;animation:stamp .26s cubic-bezier(.2,1.5,.4,1)}
@keyframes stamp{from{opacity:0;transform:scale(1.5) rotate(-9deg)}to{opacity:1;transform:none}}

/* join */
.join{border:1px dashed var(--line);border-radius:var(--r);padding:52px 26px;text-align:center;max-width:540px;margin:20px auto}
.join img{width:104px;opacity:.9;margin-bottom:16px}
.join h2{font-family:var(--display);font-size:13px;letter-spacing:.1em;font-weight:400;margin-bottom:10px}
.join p{color:var(--dim);max-width:42ch;margin:0 auto 22px;font-size:15px;line-height:1.55}
.codebox{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}
input[type=text]{background:var(--void);border:1px solid var(--line);border-radius:999px;padding:11px 20px;
  color:var(--text);font-family:var(--display);font-size:15px;letter-spacing:.14em;text-align:center;width:190px;text-transform:uppercase}
input[type=text]:focus{border-color:var(--iris);outline:none}
input[type=file]{display:none}

footer{margin-top:auto;padding-top:26px;color:var(--dim);font-size:12px;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.sync{display:flex;align-items:center;gap:7px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--dim);transition:background .3s}
.dot.on{background:var(--live);box-shadow:0 0 9px var(--live)}
.dot.warn{background:var(--warn)}
.roomtag{font-family:var(--display);font-size:10px;letter-spacing:.16em;color:var(--lilac)}

.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:9;background:var(--panel2);
  border:1px solid var(--iris);border-radius:999px;padding:11px 22px;font-size:14px;opacity:0;pointer-events:none;
  transition:opacity .2s,bottom .2s}
.toast.show{opacity:1;bottom:34px}

/* ---------- verdict flash ---------- */
.verdict{position:fixed;inset:0;z-index:45;display:grid;place-items:center;pointer-events:none;opacity:0}
.verdict.show{animation:vfade 2.2s ease forwards}
@keyframes vfade{0%{opacity:0}12%{opacity:1}72%{opacity:1}100%{opacity:0}}
.verdict::before{content:'';position:absolute;inset:0;backdrop-filter:blur(3px)}
.verdict.ok::before{background:radial-gradient(closest-side,rgba(55,227,155,.24),transparent 72%)}
.verdict.no::before{background:radial-gradient(closest-side,rgba(255,46,107,.26),transparent 72%)}
.verdict svg{width:min(38vw,240px);height:min(38vw,240px);fill:none;stroke-width:9;stroke-linecap:round;
  stroke-linejoin:round;position:relative;filter:drop-shadow(0 0 26px currentColor)}
.verdict.ok svg{stroke:var(--live);color:var(--live)}
.verdict.no svg{stroke:var(--strike);color:var(--strike)}
.verdict.show svg{animation:vpop .5s cubic-bezier(.2,1.5,.4,1)}
@keyframes vpop{0%{transform:scale(.4) rotate(-12deg);opacity:0}60%{opacity:1}100%{transform:none;opacity:1}}
.verdict svg path,.verdict svg line{stroke-dasharray:200;stroke-dashoffset:200}
.verdict.show svg path,.verdict.show svg line{animation:draw .45s .1s ease forwards}
.verdict.show svg line:nth-of-type(2){animation-delay:.26s}
@keyframes draw{to{stroke-dashoffset:0}}

/* ---------- answer reveal ---------- */
.reveal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:24px;
  background:rgba(8,4,14,.9);backdrop-filter:blur(16px);opacity:0;pointer-events:none;transition:opacity .45s ease}
.reveal.show{opacity:1;pointer-events:auto}
.rings{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.rings i{position:absolute;width:220px;height:220px;border-radius:50%;border:1.5px solid var(--iris);opacity:0}
.reveal.show .rings i{animation:ring 2.6s cubic-bezier(.2,.7,.3,1) infinite}
.reveal.show .rings i:nth-child(2){animation-delay:.55s;border-color:var(--strike)}
.reveal.show .rings i:nth-child(3){animation-delay:1.1s;border-color:var(--lilac)}
@keyframes ring{0%{transform:scale(.55);opacity:.75}100%{transform:scale(3.6);opacity:0}}

.revcard{position:relative;text-align:center;max-width:400px;width:100%}
.reveal.show .revcard{animation:revpop .75s cubic-bezier(.18,1.3,.35,1)}
@keyframes revpop{0%{transform:perspective(900px) rotateY(-95deg) scale(.7);opacity:0}
                  55%{opacity:1}100%{transform:none;opacity:1}}
.revface{width:min(58vw,236px);height:min(58vw,236px);margin:0 auto 22px;border-radius:26px;overflow:hidden;
  border:2px solid var(--iris);box-shadow:0 0 0 8px rgba(123,77,255,.16),0 26px 70px rgba(0,0,0,.7);position:relative}
.revface img{width:100%;height:100%;object-fit:cover;display:block}
.revface .initial{width:100%;height:100%;display:grid;place-items:center;font-family:var(--display);font-size:74px;color:#fff}
.revface::after{content:'';position:absolute;inset:0;
  background:linear-gradient(115deg,transparent 38%,rgba(255,255,255,.32) 50%,transparent 62%);
  transform:translateX(-130%)}
.reveal.show .revface::after{animation:sheen 1.5s .55s ease-out}
@keyframes sheen{to{transform:translateX(130%)}}
.revkick{font-family:var(--display);font-size:10px;letter-spacing:.4em;color:var(--strike);display:block;margin-bottom:12px}
.revname{font-family:var(--display);font-size:clamp(21px,5.2vw,36px);letter-spacing:.06em;line-height:1.25;
  text-shadow:0 0 34px rgba(123,77,255,.6);word-break:break-word}
.reveal.show .revkick{animation:rise .55s .45s both}
.reveal.show .revname{animation:rise .6s .58s both}
@keyframes rise{from{opacity:0;transform:translateY(20px);letter-spacing:.3em}to{opacity:1;transform:none}}
.revclose{margin-top:30px}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  .verdict.show{opacity:1}
  .verdict svg path,.verdict svg line{stroke-dashoffset:0}
}
@media(max-width:560px){
  .board{grid-template-columns:repeat(auto-fill,minmax(102px,1fr));gap:9px}
  .card .plate{font-size:12px;padding:18px 8px 7px}
}
</style>
</head>

const DEFAULT_BG_B=45;
const K_ROOM="epalgw.room", K_STATE="epalgw.state", K_BOARD="epalgw.board";
const K_VOL="epalgw.vol", K_MUTE="epalgw.mute";
const $=s=>document.querySelector(s);

const store=(()=>{
  const mem=new Map(); let ok=true;
  try{localStorage.setItem("__t","1");localStorage.removeItem("__t")}catch(e){ok=false}
  return{ok,
    get:k=>{try{return ok?localStorage.getItem(k):mem.get(k)??null}catch(e){return mem.get(k)??null}},
    set:(k,v)=>{try{ok?localStorage.setItem(k,v):mem.set(k,v)}catch(e){mem.set(k,v)}},
    del:k=>{try{ok?localStorage.removeItem(k):mem.delete(k)}catch(e){mem.delete(k)}}};
})();

let sb=null, cloud=false;
if(SUPABASE_URL && SUPABASE_KEY){
  try{
    const {createClient}=await import("https://esm.sh/@supabase/supabase-js@2");
    sb=createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:false}});
    cloud=true;
  }catch(e){ console.warn("Supabase did not load:",e) }
}

let board=null, out=new Set(), room=null, channel=null;
let timer=null, skew=0, lastVerdict=0, revealedId=null;

const hue=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%360;return h};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function faceHTML(p){
  if(p.img) return `<img src="${esc(p.img)}" alt="" loading="lazy">`;
  const h=hue(p.name||"?");
  return `<div class="initial" style="background:linear-gradient(150deg,hsl(${h} 62% 46%),hsl(${(h+42)%360} 66% 26%))">${esc((p.name||"?").trim()[0].toUpperCase())}</div>`;
}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(t._x);t._x=setTimeout(()=>t.classList.remove("show"),2200)}
function setStatus(cls,txt){ $("#dot").className="dot"+(cls?" "+cls:""); $("#syncTxt").textContent=txt }
const X_SVG=`<svg class="stamp" viewBox="0 0 100 100" aria-hidden="true"><g stroke="var(--strike)" stroke-width="13" stroke-linecap="round"><line x1="24" y1="21" x2="77" y2="80"/><line x1="78" y1="23" x2="22" y2="78"/></g></svg>`;

/* The host may send either a plain URL (older versions) or
   {url, b} where b is 0-100 brightness. Accept both. */
function readBg(v){
  if(!v) return null;
  // Depending on the column type this can arrive as an object, or as
  // JSON that is still a string. Unwrap it before doing anything else.
  if(typeof v==="string"){
    const s=v.trim();
    if(s.startsWith("{")||s.startsWith("\"")){
      try{ v=JSON.parse(s) }catch(e){ return {url:s,b:55} }
      return readBg(v);
    }
    return {url:s,b:55};                       // a plain link
  }
  if(typeof v==="object" && v.url){
    const b=Number(v.b);
    return {url:String(v.url),b:Number.isFinite(b)?b:55};
  }
  return null;
}
function applyBg(v){
  const el=$("#bg");
  const bg=readBg(v) || {url:DEFAULT_BG,b:DEFAULT_BG_B};
  console.log("[epal] background:",bg.url.slice(0,60),"at",bg.b+"%");
  if(bg){
    const img=new Image();                       // confirm it actually loads
    img.onerror=()=>console.warn("[epal] background image failed to load:",bg.url);
    img.src=bg.url;
    el.style.backgroundImage=`url("${String(bg.url).replace(/"/g,"%22")}")`;
    el.style.opacity=(Math.max(0,Math.min(100,bg.b))/100).toFixed(2);  // inline beats any CSS
    el.classList.add("on"); document.body.classList.add("hasbg");
  }
}

/* ---------- board ---------- */
function render(){
  const stage=$("#stage");
  if(!board||!board.tiles?.length){
    stage.innerHTML=`<div class="join">
      <img src="${MASCOT}" alt="">
      <h2>${cloud?"ENTER THE ROOM CODE":"NOT CONNECTED"}</h2>
      <p>${cloud?"Your host has a code on their screen. Type it once and the board arrives, then updates on its own.":"This copy has no Supabase keys in it."}</p>
      <div class="codebox">
        ${cloud?`<input type="text" id="codeIn" placeholder="EPAL-0000" maxlength="12" autocomplete="off"><button class="btn solid" id="joinBtn">Join</button>`:""}
      </div>
    </div>`;
    const j=$("#joinBtn"), c=$("#codeIn");
    if(j){ j.onclick=()=>join(c.value); c.onkeydown=e=>{if(e.key==="Enter")join(c.value)} }
    $("#left").textContent="0"; $("#leave").hidden=!room;
    return;
  }
  stage.innerHTML=`<div class="board">${board.tiles.map(p=>`
    <button class="card ${out.has(p.id)?"out":""}" data-id="${esc(p.id)}" aria-pressed="${out.has(p.id)}">
      <span class="pic">${faceHTML(p)}</span>${X_SVG}
      <span class="plate">${esc(p.name)}</span>
    </button>`).join("")}</div>`;
  stage.querySelectorAll(".card").forEach(b=>b.onclick=()=>flip(b.dataset.id));
  $("#left").textContent=board.tiles.length-out.size;
  $("#leave").hidden=!room;
}
function flip(id){ out.has(id)?out.delete(id):out.add(id); saveState(); render() }
function saveState(){ store.set(K_STATE,JSON.stringify({b:board?.id,out:[...out]})) }
function setBoard(b){
  const changed=!board||board.id!==b.id;
  board=b;
  if(changed){ out=new Set() }
  else{ try{ const s=JSON.parse(store.get(K_STATE)||"{}"); if(s.b===b.id) out=new Set(s.out||[]) }catch(e){} }
  saveState(); store.set(K_BOARD,JSON.stringify(b)); render();
}

/* ---------- timer ---------- */
function applyTimer(t,rowStamp){
  timer=t||null;
  if(rowStamp) skew=Date.parse(rowStamp)-Date.now();
  $("#clock").hidden=!timer;
  tick();
}
function remaining(){
  if(!timer) return 0;
  if(timer.running && timer.endsAt) return Math.max(0,(Date.parse(timer.endsAt)-skew-Date.now())/1000);
  return Math.max(0,timer.remaining||0);
}
function fmt(s){ s=Math.ceil(s); return Math.floor(s/60)+":"+String(s%60).padStart(2,"0") }
function tick(){
  if(!timer){ return }
  const r=remaining(), el=$("#clock");
  $("#clockT").textContent=fmt(r);
  el.className="clock"+(r<=0?" done":r<=5?" crit":r<=10?" low":"");
}
setInterval(tick,200);

/* ---------- verdict ---------- */
const ICON_OK=`<svg viewBox="0 0 100 100"><path d="M22 52l20 20 37-44"/></svg>`;
const ICON_NO=`<svg viewBox="0 0 100 100"><line x1="26" y1="26" x2="74" y2="74"/><line x1="74" y1="26" x2="26" y2="74"/></svg>`;
function showVerdict(v){
  if(!v||!v.at||v.at===lastVerdict) return;
  lastVerdict=v.at;
  const el=$("#verdict"), ok=v.type==="correct";
  el.className="verdict";
  el.innerHTML = ok?ICON_OK:ICON_NO;   // only ever one icon in the DOM
  void el.offsetWidth;
  el.className="verdict show "+(ok?"ok":"no");
  clearTimeout(el._t);
  el._t=setTimeout(()=>{ el.className="verdict"; el.innerHTML="" },2300);
}
/* ---------- reveal ---------- */
function showReveal(ans,id){
  if(!ans) return;
  if(revealedId===id) return;
  revealedId=id;
  $("#revFace").innerHTML=faceHTML(ans);
  $("#revName").textContent=ans.name;
  $("#reveal").classList.add("show");
}
$("#revClose").onclick=()=>$("#reveal").classList.remove("show");
$("#reveal").onclick=e=>{ if(e.target===$("#reveal")) $("#reveal").classList.remove("show") };

/* ---------- room ---------- */
function applyRow(row){
  if(row.timer!==undefined) applyTimer(row.timer,row.updated_at);
  applyBg(row.background);
  const tiles=row.board||[];
  if(tiles.length){
    setBoard({id:row.board_id||row.updated_at||String(Date.now()),title:row.title,tiles});
    setStatus("on","Live with the host");
  }else{
    setStatus("on","Live — waiting for the board");
  }
  if(row.revealed && row.answer) showReveal(row.answer,row.board_id+"|"+(row.answer.id||""));
  else{ revealedId=null; $("#reveal").classList.remove("show") }
  showVerdict(row.verdict);
}
async function join(raw){
  const code=(raw||"").trim().toUpperCase();
  if(!code){ toast("Type the code your host is showing"); return }
  if(!cloud){ toast("This copy isn't connected"); return }
  setStatus("warn","Joining "+code+"...");
  const {data,error}=await sb.from("epal_rooms").select("*").eq("code",code).maybeSingle();
  if(error){ setStatus("","Couldn't reach the server"); toast("Couldn't reach the server: "+error.message); return }
  if(!data){ setStatus("","Not in a room"); toast("No room called "+code+" — check it with your host"); return }
  room=code; store.set(K_ROOM,code); $("#roomTag").textContent="ROOM "+code;
  applyRow(data); listen(code);
}
function listen(code){
  if(channel) sb.removeChannel(channel);
  channel=sb.channel("epal-room-"+code)
    .on("postgres_changes",{event:"*",schema:"public",table:"epal_rooms",filter:"code=eq."+code},
      p=>{ if(p.new) applyRow(p.new) })
    .subscribe(st=>{
      if(st==="SUBSCRIBED") setStatus("on","Live with the host");
      else if(st==="CHANNEL_ERROR"||st==="TIMED_OUT") setStatus("warn","Reconnecting...");
    });
}
$("#leave").onclick=()=>{
  if(channel){ sb.removeChannel(channel); channel=null }
  room=null; board=null; timer=null; $("#clock").hidden=true;
  store.del(K_ROOM); store.del(K_BOARD);
  $("#roomTag").textContent=""; setStatus("","Not in a room"); render();
};
$("#reset").onclick=()=>{ out.clear(); saveState(); render(); toast("Everyone's back on the board") };

/* ---------- music ---------- */
const audio=new Audio(); audio.loop=true; audio.preload="auto"; audio.src="guess-the-epal-music.mp3";
const volEl=$("#vol"), slider=$("#slider");
let level=+(store.get(K_VOL)??8), muted=store.get(K_MUTE)==="1", armed=false, missing=false;
slider.value=level; applyVol();
function applyVol(){
  audio.volume=Math.max(0,Math.min(30,level))/100;
  const off=muted||level===0;
  volEl.classList.toggle("muted",off);
  $("#wave1").style.display=off?"none":"";
  $("#wave2").style.display=(off||level<5)?"none":"";
  $("#slash").style.display=off?"":"none";
  if(off) audio.pause(); else if(armed) audio.play().catch(()=>{});
}
function arm(){ if(armed||missing)return; armed=true; if(!muted&&level>0) audio.play().catch(()=>{}) }
document.addEventListener("pointerdown",arm,{once:true});
document.addEventListener("keydown",arm,{once:true});
$("#spk").onclick=e=>{
  e.stopPropagation();
  if(missing){ $("#musicFile").click(); return }
  if(!volEl.classList.contains("open")){ volEl.classList.add("open"); return }
  muted=!muted; store.set(K_MUTE,muted?"1":"0"); applyVol();
};
slider.oninput=()=>{ level=+slider.value; muted=false; store.set(K_VOL,String(level)); store.set(K_MUTE,"0"); arm(); applyVol() };
document.addEventListener("pointerdown",e=>{ if(!volEl.contains(e.target)) volEl.classList.remove("open") });
audio.addEventListener("error",()=>{ missing=true; volEl.classList.add("muted"); volEl.classList.remove("open"); $("#spk").title="Music file not found — click to pick it" });
$("#musicFile").onchange=e=>{
  const f=e.target.files[0]; if(!f)return;
  audio.src=URL.createObjectURL(f); missing=false; armed=false; muted=false;
  store.set(K_MUTE,"0"); arm(); applyVol(); toast("Music loaded"); e.target.value="";
};

/* ---------- boot ---------- */
const urlCode=new URLSearchParams(location.search).get("room");
const savedRoom=store.get(K_ROOM), cachedBoard=store.get(K_BOARD);
if(cachedBoard){ try{ board=JSON.parse(cachedBoard);
  const s=JSON.parse(store.get(K_STATE)||"{}"); if(s.b===board.id) out=new Set(s.out||[]) }catch(e){} }
applyBg(null);          // default backdrop from the first frame
render();
if(cloud && (urlCode||savedRoom)) join(urlCode||savedRoom);
else if(!cloud) setStatus("","No Supabase keys in this file");
</script>
</body>
</html>
